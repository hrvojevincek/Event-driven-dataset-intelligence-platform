openapi: 3.1.0
info:
  title: EventForge API
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /health/ready:
    get:
      tags:
      - health
      summary: Health Ready
      operationId: health_ready_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Ready Health Ready Get
  /api/v1/projects:
    get:
      tags:
      - api
      summary: List User Projects
      operationId: list_user_projects_api_v1_projects_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProjectSummaryResponse'
                type: array
                title: Response List User Projects Api V1 Projects Get
    post:
      tags:
      - api
      summary: Create Project
      operationId: create_project_api_v1_projects_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_project_api_v1_projects_post'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitProjectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{project_id}:
    get:
      tags:
      - api
      summary: Get Project
      operationId: get_project_api_v1_projects__project_id__get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - api
      summary: Remove Project
      operationId: remove_project_api_v1_projects__project_id__delete
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{project_id}/export:
    get:
      tags:
      - api
      summary: Download Project Export
      operationId: download_project_export_api_v1_projects__project_id__export_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: format
        in: query
        required: false
        schema:
          type: string
          default: jsonl
          title: Format
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{project_id}/stream:
    get:
      tags:
      - api
      summary: Stream Project Events
      description: Stream pipeline stage updates for a job via Server-Sent Events.
      operationId: stream_project_events_api_v1_projects__project_id__stream_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/:
    get:
      tags:
      - api
      summary: Api V1 Root
      operationId: api_v1_root_api_v1__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Api V1 Root Api V1  Get
components:
  schemas:
    AssetResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        filename:
          type: string
          title: Filename
        mime_type:
          type: string
          title: Mime Type
        byte_size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Byte Size
        fetch_status:
          type: string
          title: Fetch Status
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - filename
      - mime_type
      - byte_size
      - fetch_status
      - created_at
      title: AssetResponse
      description: Uploaded file registered during intake.
    Body_create_project_api_v1_projects_post:
      properties:
        name:
          type: string
          minLength: 1
          title: Name
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
        schema_template:
          anyOf:
          - type: string
          - type: 'null'
          title: Schema Template
        schema_json_override:
          anyOf:
          - type: string
          - type: 'null'
          title: Schema Json Override
        domain:
          type: string
          title: Domain
          default: documents
      type: object
      required:
      - name
      - files
      title: Body_create_project_api_v1_projects_post
    DatasetExportSummaryResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        line_count:
          type: integer
          title: Line Count
        created_at:
          type: string
          format: date-time
          title: Created At
        qc_report:
          $ref: '#/components/schemas/QCReportResponse'
      type: object
      required:
      - id
      - line_count
      - created_at
      - qc_report
      title: DatasetExportSummaryResponse
      description: Export metadata without the full JSONL payload.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    JobStageResponse:
      properties:
        stage:
          type: string
          title: Stage
        status:
          type: string
          title: Status
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
        duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Ms
        error_detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Detail
      type: object
      required:
      - stage
      - status
      title: JobStageResponse
      description: One pipeline stage row for SSE snapshots.
    LLMUsageCallResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        agent_name:
          type: string
          title: Agent Name
        model:
          type: string
          title: Model
        input_tokens:
          type: integer
          title: Input Tokens
        output_tokens:
          type: integer
          title: Output Tokens
        cost_usd:
          type: number
          title: Cost Usd
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - agent_name
      - model
      - input_tokens
      - output_tokens
      - cost_usd
      - created_at
      title: LLMUsageCallResponse
      description: One logged LLM call for a project.
    LLMUsageSummaryResponse:
      properties:
        total_cost_usd:
          type: number
          title: Total Cost Usd
        calls:
          items:
            $ref: '#/components/schemas/LLMUsageCallResponse'
          type: array
          title: Calls
      type: object
      required:
      - total_cost_usd
      - calls
      title: LLMUsageSummaryResponse
      description: Aggregated LLM cost and per-call breakdown for a project.
    ProjectDetailResponse:
      properties:
        job_id:
          type: string
          format: uuid
          title: Job Id
        correlation_id:
          type: string
          title: Correlation Id
        name:
          type: string
          title: Name
        schema_template:
          anyOf:
          - type: string
          - type: 'null'
          title: Schema Template
        domain:
          type: string
          title: Domain
        status:
          type: string
          title: Status
        label_schema_json:
          type: string
          title: Label Schema Json
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        stages:
          items:
            $ref: '#/components/schemas/JobStageResponse'
          type: array
          title: Stages
        assets:
          items:
            $ref: '#/components/schemas/AssetResponse'
          type: array
          title: Assets
        dataset_export:
          anyOf:
          - $ref: '#/components/schemas/DatasetExportSummaryResponse'
          - type: 'null'
        llm_usage:
          $ref: '#/components/schemas/LLMUsageSummaryResponse'
      type: object
      required:
      - job_id
      - correlation_id
      - name
      - schema_template
      - domain
      - status
      - label_schema_json
      - created_at
      - updated_at
      - stages
      - llm_usage
      title: ProjectDetailResponse
      description: Full project detail including stages, assets, and optional export.
    ProjectSummaryResponse:
      properties:
        job_id:
          type: string
          format: uuid
          title: Job Id
        correlation_id:
          type: string
          title: Correlation Id
        name:
          type: string
          title: Name
        schema_template:
          anyOf:
          - type: string
          - type: 'null'
          title: Schema Template
        domain:
          type: string
          title: Domain
        status:
          type: string
          title: Status
        asset_count:
          type: integer
          title: Asset Count
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - job_id
      - correlation_id
      - name
      - schema_template
      - domain
      - status
      - asset_count
      - created_at
      - updated_at
      title: ProjectSummaryResponse
      description: Lightweight project summary for list endpoints.
    QCReportResponse:
      properties:
        coverage_pct:
          type: number
          title: Coverage Pct
        schema_compliance_pct:
          type: number
          title: Schema Compliance Pct
        low_confidence_segment_ids:
          items:
            type: string
          type: array
          title: Low Confidence Segment Ids
        total_cost_usd:
          type: number
          title: Total Cost Usd
        segment_count:
          type: integer
          title: Segment Count
        labeled_count:
          type: integer
          title: Labeled Count
        batch_count:
          type: integer
          title: Batch Count
        flags:
          items:
            type: string
          type: array
          title: Flags
      type: object
      required:
      - coverage_pct
      - schema_compliance_pct
      - low_confidence_segment_ids
      - total_cost_usd
      - segment_count
      - labeled_count
      - batch_count
      - flags
      title: QCReportResponse
      description: Quality-control summary for a completed export.
    SubmitProjectResponse:
      properties:
        job_id:
          type: string
          format: uuid
          title: Job Id
        correlation_id:
          type: string
          title: Correlation Id
        asset_count:
          type: integer
          minimum: 1.0
          title: Asset Count
      type: object
      required:
      - job_id
      - correlation_id
      - asset_count
      title: SubmitProjectResponse
      description: Response after a project is accepted and queued for intake.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
